<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
    />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #0b0f14;
      }
      body {
        font-family: "Space Grotesk", system-ui, sans-serif;
      }
      code,
      pre,
      .mono {
        font-family: "JetBrains Mono", monospace;
      }

      /* ---- Beat 1: title ---- */
      #title {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        opacity: 1;
      }
      #title .title-text {
        color: #f7f6f2;
        font-size: 88px;
        font-weight: 600;
        letter-spacing: -0.01em;
      }

      /* ---- Cards (beats 2-4) ---- */
      .card {
        position: absolute;
        top: 340px;
        width: 600px;
        height: 420px;
        border-radius: 18px;
        background: rgba(247, 246, 242, 0.05);
        border: 1px solid rgba(247, 246, 242, 0.14);
        padding: 56px 52px;
        opacity: 0;
      }
      #cardA {
        left: 160px;
        transform: translateX(-40px);
      }
      #cardB {
        left: 1160px;
        transform: translateX(40px);
        border-color: rgba(194, 69, 59, 0.55);
      }
      .card-claim {
        color: #f7f6f2;
        font-size: 38px;
        font-weight: 500;
        line-height: 1.3;
        margin-bottom: 40px;
        white-space: nowrap;
      }
      .card-field {
        display: flex;
        align-items: baseline;
        gap: 16px;
        margin-bottom: 18px;
        opacity: 0;
      }
      .card-field .field-label {
        color: #6b7785;
        font-size: 28px;
        font-weight: 500;
      }
      .card-field .field-value {
        color: #f7f6f2;
        font-size: 28px;
      }
      .card-field.invalidated .field-label {
        color: #c2453b;
        font-size: 28px;
        font-weight: 600;
      }

      /* ---- Beat 3: verdict row ---- */
      #verdicts {
        position: absolute;
        top: 830px;
        left: 0;
        width: 1920px;
        display: flex;
        justify-content: center;
        gap: 64px;
        opacity: 0;
      }
      .verdict {
        color: #6b7785;
        font-size: 34px;
        font-weight: 500;
      }
      .verdict-supersede {
        color: #6b7785;
      }

      /* ---- Beat 4: connecting line ---- */
      #link {
        position: absolute;
        inset: 0;
      }
      #linkContent {
        opacity: 0;
      }
      #link .superseded-label {
        fill: #f7f6f2;
        font-family: "JetBrains Mono", monospace;
        font-size: 26px;
        opacity: 0;
      }

      /* ---- Beat 5: end ---- */
      #scrim {
        position: absolute;
        inset: 0;
        background: #0b0f14;
        opacity: 0;
      }
      #end {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 22px;
      }
      #end .wordmark {
        color: #f7f6f2;
        font-size: 72px;
        font-weight: 700;
        opacity: 0;
      }
      #end .tagline {
        color: #f7f6f2;
        font-size: 34px;
        font-weight: 500;
        opacity: 0;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="30"
      data-width="1920"
      data-height="1080"
    >
      <!-- Beat 1 (0:00-0:04): title -->
      <div id="title" class="clip" data-start="0" data-duration="4" data-track-index="0">
        <div class="title-text">you already know something.</div>
      </div>

      <!-- Beat 2 (0:04-0:12): the held fact -->
      <div id="cardA" class="clip card" data-start="4" data-duration="26" data-track-index="1">
        <div class="card-claim">Priya is the project lead.</div>
        <div class="card-field" id="cardAGrounded">
          <span class="field-label mono">grounded_in</span>
          <span class="field-value mono">kickoff-notes.md</span>
        </div>
        <div class="card-field invalidated" id="cardAInvalidated">
          <span class="field-label mono">invalidated_at</span>
        </div>
      </div>

      <!-- Beat 3 (0:12-0:20): the contradiction -->
      <div id="cardB" class="clip card" data-start="12" data-duration="18" data-track-index="2">
        <div class="card-claim">Jordan is the project lead.</div>
        <div class="card-field" id="cardBGrounded">
          <span class="field-label mono">grounded_in</span>
          <span class="field-value mono">org-chart.md</span>
        </div>
      </div>

      <div id="verdicts" class="clip" data-start="14" data-duration="16" data-track-index="3">
        <span class="verdict mono" data-verdict="add">add</span>
        <span class="verdict mono" data-verdict="update">update</span>
        <span class="verdict mono" data-verdict="noop">noop</span>
        <span class="verdict verdict-supersede mono" data-verdict="supersede">supersede</span>
      </div>

      <!-- Beat 4 (0:20-0:27): the payload -->
      <svg
        id="link"
        class="clip"
        data-start="20"
        data-duration="10"
        data-track-index="4"
        width="1920"
        height="1080"
        viewBox="0 0 1920 1080"
      >
        <g id="linkContent">
          <line
            id="linkLine"
            x1="760"
            y1="550"
            x2="1160"
            y2="550"
            stroke="#f7f6f2"
            stroke-width="3"
            stroke-dasharray="420"
            stroke-dashoffset="420"
          />
          <text class="superseded-label" id="linkLabel" x="960" y="520" text-anchor="middle">
            superseded_by
          </text>
        </g>
      </svg>

      <!-- Beat 5 (0:27-0:30): end -->
      <div
        id="scrim"
        class="clip"
        data-start="27.3"
        data-duration="2.7"
        data-track-index="5"
        data-layout-allow-occlusion="true"
      ></div>
      <div id="end" class="clip" data-start="27.3" data-duration="2.7" data-track-index="6">
        <div class="wordmark">delapan</div>
        <div class="tagline">nothing is deleted. only retired.</div>
      </div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      // Beat 1: title (0-4) - visible from frame one (poster frame), fades out
      // at the end of the beat.
      tl.to("#title", { opacity: 0, duration: 0.5, ease: "power1.in" }, 3.4);

      // Beat 2: the held fact (4-12)
      tl.fromTo(
        "#cardA",
        { opacity: 0, x: -40 },
        { opacity: 1, x: 0, duration: 0.8, ease: "power2.out" },
        4.0,
      );
      tl.to("#cardAGrounded", { opacity: 1, duration: 0.6, ease: "power1.out" }, 5.2);

      // Beat 3: the contradiction (12-20)
      tl.fromTo(
        "#cardB",
        { opacity: 0, x: 40 },
        { opacity: 1, x: 0, duration: 0.8, ease: "power2.out" },
        12.0,
      );
      tl.to("#cardBGrounded", { opacity: 1, duration: 0.6, ease: "power1.out" }, 13.0);
      tl.to("#verdicts", { opacity: 1, duration: 0.5, ease: "power1.out" }, 14.5);
      // supersede lights: the one coral moment in the whole piece
      tl.to(
        ".verdict-supersede",
        { color: "#ff6b4a", scale: 1.15, duration: 0.4, ease: "back.out(2)" },
        18.0,
      );
      tl.to(".verdict-supersede", { scale: 1.0, duration: 0.3, ease: "power1.out" }, 18.4);

      // Beat 4: the payload (20-27) - both cards stay on screen
      tl.to("#linkContent", { opacity: 1, duration: 0.3 }, 20.0);
      tl.to(
        ["#cardAGrounded", "#cardA .card-claim"],
        { opacity: 0.4, duration: 0.8, ease: "power1.inOut" },
        20.0,
      );
      tl.to("#cardA", { borderColor: "rgba(194, 69, 59, 0.4)", duration: 0.8 }, 20.0);
      tl.to("#cardAInvalidated", { opacity: 1, duration: 0.6, ease: "power1.out" }, 20.4);
      tl.to("#linkLine", { strokeDashoffset: 0, duration: 1.4, ease: "power2.inOut" }, 22.0);
      tl.to("#linkLabel", { opacity: 1, duration: 0.6, ease: "power1.out" }, 23.3);

      // Beat 5: end (27.3-30) - the co-presence checkpoint (t=27.0, see
      // design.md) must read clean: cards at full opacity, superseded_by
      // link still present, scrim contributing zero opacity. Only after
      // that does the link fade out (so its label never overlaps the
      // wordmark text) and the scrim rise. #link is a clip-managed element;
      // animate the inner, non-clip wrapper instead and hard-kill it right
      // after its fade so it can't bleed into the scrim ramp.
      tl.to("#linkContent", { opacity: 0, duration: 0.3, ease: "power1.in" }, 27.0);
      tl.set("#linkContent", { opacity: 0 }, 27.3);
      tl.to("#scrim", { opacity: 0.9, duration: 0.4, ease: "power1.inOut" }, 27.3);
      tl.fromTo(
        "#end .wordmark",
        { y: 20 },
        { opacity: 1, y: 0, duration: 0.4, ease: "power2.out" },
        27.4,
      );
      tl.to("#end .tagline", { opacity: 1, duration: 0.3, ease: "power1.out" }, 27.8);

      // Pin the GSAP timeline's total duration to the composition's declared
      // 30s (data-duration on #root) — without this, GSAP auto-computes
      // duration from the last tween's end (28.6s), which desyncs any
      // progress-fraction-based scrubbing from these absolute-second cues.
      tl.set("#root", { opacity: 1 }, 30);

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
